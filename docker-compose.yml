services:
  api:
    build:
      context: ./backend
      target: dev
    ports:
      - "${API_PORT:-3001}:3001"
    environment:
      - NODE_ENV=development
      - PORT=3001
      - HOST=0.0.0.0
    volumes:
      - ./backend:/app
      - api_node_modules:/app/node_modules
    command: npm run dev

  next:
    build:
      context: ./web/next
      target: dev
    ports:
      - "${NEXT_PORT:-3000}:3000"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:3001}
      - API_INTERNAL_URL=${API_INTERNAL_URL:-http://api:3001}
    volumes:
      - ./web/next:/app
      - next_node_modules:/app/node_modules
      - next_cache:/app/.next
    depends_on:
      - api

volumes:
  api_node_modules:
  next_node_modules:
  next_cache:
