services:
  api:
    build:
      context: ./backend
      target: dev
    ports:
      - "${API_PORT:-3001}:3001"
    environment:
      - NODE_ENV=development
      - PORT=3001
      - HOST=0.0.0.0
    volumes:
      - ./backend:/app
      - api_node_modules:/app/node_modules
    command: npm run dev

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: taskforge
      POSTGRES_PASSWORD: taskforge
      POSTGRES_DB: taskforge
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  next:
    build:
      context: ./web/next
      target: dev
    ports:
      - "${NEXT_PORT:-3000}:3000"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:3001}
      - API_INTERNAL_URL=${API_INTERNAL_URL:-http://api:3001}
      - DATABASE_URL=postgresql://taskforge:taskforge@db:5432/taskforge?schema=public
    volumes:
      - ./web/next:/app
      - next_node_modules:/app/node_modules
      - next_cache:/app/.next
    depends_on:
      - api
      - db

volumes:
  api_node_modules:
  next_node_modules:
  next_cache:
  pgdata:
